<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>gauge style samples</title>
<style>
  body { margin: 0; background: #0e1116; color: #fff; font-family: sans-serif; }
  #wrap { padding: 14px 18px; }
  h1 { font: 600 20px Rajdhani, sans-serif; letter-spacing: 3px; color: #8fa4bb;
       margin: 2px 0 12px; text-transform: uppercase; }
  .row { display: flex; gap: 14px; }
  .cell { text-align: center; }
  .cap { font: 600 12px Rajdhani, sans-serif; color: #7f93aa;
         letter-spacing: 3px; margin-top: 5px; }
  canvas { background: #111418; border-radius: 10px; display: block; }
</style>
</head>
<body>
<div id="wrap">
  <h1 id="title">style</h1>
  <div class="row" id="row"></div>
</div>
<script src="/static/model.js?v=5"></script>
<script src="/static/capture.js?v=5"></script>
<script>
const CASES = {
  tach: [
    { frac: 0.12, value: "6.2",  label: "SPEED", unit: "km/h" },
    { frac: 0.52, value: "24.8", label: "SPEED", unit: "km/h" },
    { frac: 0.95, value: "47.9", label: "SPEED", unit: "km/h" },
  ],
  ledbar: [
    { frac: 0.25, value: "42",  label: "CADENCE", unit: "rpm" },
    { frac: 0.55, value: "86",  label: "CADENCE", unit: "rpm" },
    { frac: 0.93, value: "112", label: "CADENCE", unit: "rpm" },
  ],
  gearbox: [
    { frac: 0.12, value: "8",  label: "KPH" },
    { frac: 0.52, value: "25", label: "KPH" },
    { frac: 0.95, value: "44", label: "KPH" },
  ],
  delta: [
    { frac: 0.2,  signed: -0.15, value: "-1.2", label: "GRADE", unit: "%" },
    { frac: 0.5,  signed: 0.30,  value: "+2.4", label: "GRADE", unit: "%" },
    { frac: 0.95, signed: 0.95,  value: "+8.1", label: "GRADE", unit: "%" },
  ],
  trace: [
    { value: "118", label: "HEART RATE", unit: "bpm",
      series: [0.25,0.30,0.28,0.35,0.32,0.38,0.34,0.36,0.33,0.35,0.31,0.34] },
    { value: "142", label: "HEART RATE", unit: "bpm",
      series: [0.45,0.50,0.52,0.48,0.55,0.58,0.54,0.60,0.57,0.59,0.56,0.58] },
    { value: "178", label: "HEART RATE", unit: "bpm",
      series: [0.75,0.80,0.78,0.85,0.82,0.88,0.90,0.86,0.92,0.88,0.90,0.93] },
  ],
  ring: [
    { frac: 0.21, value: "6.2",  label: "DISTANCE", sub: "of 30 km · 21%", accent: "rgb(56,189,248)" },
    { frac: 0.53, value: "16.0", label: "DISTANCE", sub: "of 30 km · 53%", accent: "rgb(56,189,248)" },
    { frac: 0.95, value: "28.5", label: "DISTANCE", sub: "of 30 km · 95%", accent: "rgb(56,189,248)" },
  ],
  pillrow: [
    { items: [ {icon:"♥", value:"118", unit:"bpm", frac:0.30},
               {icon:"◉", value:"6.2", unit:"km/h", frac:0.12},
               {icon:"⚙", value:"42", unit:"rpm", frac:0.25} ] },
    { items: [ {icon:"♥", value:"142", unit:"bpm", frac:0.55},
               {icon:"◉", value:"24.8", unit:"km/h", frac:0.52},
               {icon:"⚙", value:"86", unit:"rpm", frac:0.55} ] },
    { items: [ {icon:"♥", value:"178", unit:"bpm", frac:0.90},
               {icon:"◉", value:"47.9", unit:"km/h", frac:0.95},
               {icon:"⚙", value:"112", unit:"rpm", frac:0.93} ] },
  ],
};
const SIZES = {
  tach: [380, 380], ledbar: [390, 210], gearbox: [380, 380], delta: [390, 210],
  trace: [390, 210], ring: [380, 380], pillrow: [400, 160],
};

async function run() {
  const faces = [
    new FontFace("Rajdhani", "url(/static/fonts/Rajdhani-SemiBold.ttf?v=2)", { weight: "600" }),
    new FontFace("Rajdhani", "url(/static/fonts/Rajdhani-Bold.ttf?v=2)", { weight: "700" }),
    new FontFace("Inter", "url(/static/fonts/Inter.ttf?v=2)"),
    new FontFace("DSEG7", "url(/static/fonts/DSEG7Classic.ttf?v=2)"),
  ];
  await Promise.allSettled(faces.map(f => f.load().then(x => document.fonts.add(x))));
  const style = (new URLSearchParams(location.search).get("s")
                 || (location.hash || "#tach").slice(1));
  const cases = CASES[style] || CASES.tach;
  const [w, h] = SIZES[style] || [380, 380];
  document.getElementById("title").textContent =
    style + " — low / mid / max  ·  rendered by capture.js engine";
  const row = document.getElementById("row");
  const caps = ["LOW", "MID", "MAX"];
  cases.forEach((c, i) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cell.appendChild(cv);
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = caps[i];
    cell.appendChild(cap);
    row.appendChild(cell);
    Capture.paintStyle(cv.getContext("2d"), style, 0, 0, w, h, c);
  });
  window.__ready = true;
}
run().catch(e => { window.__err = String(e && e.stack || e); });
</script>
</body>
</html>

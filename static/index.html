<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GPX Overlay Studio</title>
<link rel="stylesheet" href="/static/style.css?v=20261015">
</head>
<body>
<header>
  <div class="brand">◈ GPX Overlay Studio</div>
  <div class="files">
    <label class="file-btn">🎞 video<input type="file" id="videoInput" accept="video/*"></label>
    <label class="file-btn">📍 gpx<input type="file" id="gpxInput" accept=".gpx,.tcx,application/gpx+xml,application/tcx+xml,application/xml,text/xml,application/octet-stream"></label>
    <button id="btnClear" class="ghost">✕ clear files</button>
    <a class="file-btn" href="/static/clipfinder.html" title="find clip candidates from GPX + video">✂ Clip Finder</a>
    <select id="presetSelect">
      <option value="gpxoverlay">Preset: GPXOVERLAY style</option>
      <option value="ride">Preset: Ride · portrait</option>
      <option value="pills">Preset A: Strava pill row</option>
      <option value="corners">Preset B: Corner gauges</option>
      <option value="minimal">Preset C: Minimal</option>
      <option value="motorsport">Preset: Motorsport</option>
      <option value="rally">Preset: Rally</option>
      <option value="gtclean">Preset: GT Clean</option>
      <option value="racetelem" selected>Preset: Race Telemetry</option>
      <option value="cinematic">Preset: Cinematic</option>
    </select>
  </div>
  <div class="status" id="fileStatus">no files loaded</div>
</header>

<main>
  <section class="preview-col">
    <div class="preview-wrap">
      <div id="stage" class="stage">
        <video id="poster" muted playsinline preload="auto"></video>
        <canvas id="trueFrame" class="hidden" style="position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none"></canvas>
        <div id="dropHint" class="drop-hint hidden">⬇ Drop video + GPX here</div>
        <canvas id="mapCanvas" class="map-overlay" width="340" height="340"></canvas>
        <canvas id="trackCanvas" class="track-overlay" width="620" height="110"></canvas>
        <!-- widget boxes injected here -->
      </div>
    </div>
    <div class="timeline-row">
      <button id="btnBack" title="step back">◀</button>
      <input type="range" id="scrub" min="0" max="1000" value="650">
      <button id="btnFwd" title="step forward">▶</button>
      <span id="scrubTime" class="mono">t = 0.0s</span>
    </div>
    <div class="match-row"><button id="matchBadge" class="match-badge hidden" type="button"></button></div>
    <div class="action-row">
      <select id="renderTarget" class="tiny" hidden title="where to render">
        <option value="modeA">this device (100% client-side)</option>
      </select>
      <button id="btnRender" class="primary">▶ RENDER</button>
      <span id="syncOffsetWrap" class="hint">sync offset
        <input type="number" id="syncOffset" value="0" step="100" class="tiny"> ms</span>
    </div>
    <div id="renderBar" class="render-bar hidden">
      <div id="renderFill"></div><span id="renderText"></span>
    </div>
  </section>

  <aside class="panel left-panel">
    <h2>Widgets <span class="hint">(☰ order)</span></h2>
    <ul id="widgetList" class="widget-list"></ul>
    <button id="btnAddWidget" class="ghost full">+ add widget</button>
  </aside>

  <div class="right-col">
    <aside class="panel right-panel">
      <h2 id="apptTitle">Appearance</h2>
      <div id="apptBody">
        <p class="hint">Select a widget to edit its appearance and position.</p>
      </div>
    </aside>

    <div id="resultZone">
      <div id="resultRow" class="result-row hidden">
        <video id="resultVideo" class="clickable"></video>
        <div class="result-actions">
          <a id="resultDownload" class="file-btn" download="overlay.mp4">⬇ download</a>
          <button id="btnNewJob" class="ghost">render again</button>
        </div>
      </div>
      <div id="pixelPreview" class="pixel-preview hidden">
        <img id="pixelImg" class="clickable" alt="pixel-true preview">
        <button id="btnClosePixel" class="ghost">close</button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast hidden"></div>
<div id="lightbox" class="lightbox hidden">
  <button id="lbClose" class="ghost lb-close">✕ close</button>
  <video id="lbVideo" class="hidden" controls playsinline></video>
  <img id="lbImg" class="hidden" alt="enlarged preview">
</div>
<script src="/static/vendor/mp4box.js?v=20261015"></script>
<script src="/static/vendor/mp4-muxer.js?v=20261015"></script>
<script src="/static/model.js?v=20261015"></script>
<script src="/static/capture.js?v=20261015"></script>
<script src="/static/export_a.js?v=20261015"></script>
<script src="/static/local.js?v=20261015"></script>
<script src="/static/app.js?v=20261015"></script>
</body>
</html>
